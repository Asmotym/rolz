services:
  mysql:
    image: mysql:8.0
    container_name: aventyr-mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aventyr}
      MYSQL_USER: ${MYSQL_USER:-aventyr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aventyr}
      MYSQL_TCP_PORT: ${MYSQL_PORT:-3306}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      PMA_HOST: mysql
      PMA_PORT: ${MYSQL_PORT:-3306}
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"

  aventyr:
    build:
      context: .
      target: runner
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
        VITE_PUBLIC_API_BASE_URL: ${VITE_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
        VITE_API_DOCS_URL: ${VITE_API_DOCS_URL:-http://localhost:6060}
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID}
        VITE_DISCORD_REDIRECT_URI: ${VITE_DISCORD_REDIRECT_URI:-http://localhost:5173}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-}
    image: aventyr-all:latest
    container_name: aventyr-stack
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      MYSQL_USER: ${MYSQL_USER:-aventyr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aventyr}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aventyr}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      AVENTYR_DEV_MODE: ${AVENTYR_DEV_MODE:-true}
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
      VITE_PUBLIC_API_BASE_URL: ${VITE_PUBLIC_API_BASE_URL:-https://api.aventyr.io/api}
      VITE_API_DOCS_URL: ${VITE_API_DOCS_URL:-http://localhost:6060}
      DATABASE_URL: ${DATABASE_URL:-mysql://aventyr:aventyr@mysql:3306/aventyr}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      VIRTUAL_HOST: aventyr.io
      VIRTUAL_PORT: 5173
      LETSENCRYPT_HOST: aventyr.io
      LETSENCRYPT_EMAIL: ${LE_EMAIL}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - ./tsconfig.server.json:/app/tsconfig.server.json
      - ./tsup.config.ts:/app/tsup.config.ts
      - ./index.html:/app/index.html
      - ./src:/app/src
      - ./server:/app/server
      - ./public:/app/public
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh
    command:
      - /bin/bash
      - /app/docker/entrypoint.sh
    restart: unless-stopped

  api-docs:
    image: swaggerapi/swagger-ui:latest
    container_name: aventyr-api-docs
    environment:
      PORT: 6000
      API_DOCS_BASE_URL: ${API_DOCS_BASE_URL:-https://api.aventyr.io/api}
      SWAGGER_JSON: /tmp/aventyr-api.yaml
      VIRTUAL_HOST: docs.aventyr.io
      VIRTUAL_PORT: 6000
      LETSENCRYPT_HOST: docs.aventyr.io
      LETSENCRYPT_EMAIL: ${LE_EMAIL}
    command:
      - sh
      - -c
      - sed "s|__API_BASE_URL__|$${API_DOCS_BASE_URL}|g" /openapi/aventyr-api.template.yaml > /tmp/aventyr-api.yaml && /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "${API_DOCS_HOST_PORT:-6060}:6000"
    volumes:
      - ./docs/openapi.template.yaml:/openapi/aventyr-api.template.yaml:ro
    restart: unless-stopped

volumes:
  mysql-data:
